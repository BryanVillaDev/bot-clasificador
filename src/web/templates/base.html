<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Bot Casita Panel{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Bot Casita</div>
  <nav>
    {% if user %}
      <a href="/dashboard">Dashboard</a>
      <a href="/jobs/new">Nuevo lote</a>
      <span class="who">{{ user.username }}</span>
      <a href="/logout">Salir</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  <small>Bot Casita</small>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
